<style>
  :root{
    --pine:#1B1512; --pine-light:#26201B; --canvas:#F1E4D2; --canvas-dim:#C7B49C;
    --amber:#C2622A; --amber-bright:#F2903D; --brick:#B33B2E; --line:#453A31;
    --ok:#7FA84F; --warn:#C9A227;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--pine); overscroll-behavior-y:none;}
  body{font-family:'Work Sans', sans-serif; color:var(--canvas); padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); min-height:100vh;}
  h1,h2,h3{font-family:'Big Shoulders Display', sans-serif; text-transform:uppercase; letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono', monospace;}
  button{font-family:inherit;}

  header{position:sticky; top:0; z-index:20; background:var(--pine); border-bottom:1px solid var(--line); padding:16px 16px 12px;}
  header h1{font-size:24px; font-weight:800; margin:0; line-height:0.95;}
  header .tagline{font-size:11px; color:var(--amber-bright); font-family:'IBM Plex Mono',monospace; letter-spacing:0.08em; margin-top:4px;}

  main{padding:14px 14px 40px; max-width:720px; margin:0 auto;}
  .section{background:var(--pine-light); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .section-num{display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%; background:var(--amber); color:var(--pine); font-family:'IBM Plex Mono'; font-weight:700; font-size:12px; margin-right:8px;}
  .section-title{font-size:15px; font-weight:700; display:flex; align-items:center; margin-bottom:12px;}
  .hint{font-size:12px; color:var(--canvas-dim); margin:-4px 0 12px; line-height:1.5;}
  .field{width:100%; padding:11px 12px; border-radius:9px; border:1px solid var(--line); background:var(--pine); color:var(--canvas); font-family:'Work Sans'; font-size:14px; outline:none;}
  .field:focus{border-color:var(--amber-bright);}
  select.field{appearance:none;}

  /* Pelanggan */
  .cust-selected{display:flex; align-items:center; justify-content:space-between; background:rgba(127,168,79,0.12); border:1px solid var(--ok); border-radius:10px; padding:12px;}
  .cust-selected .cn{font-weight:700; font-size:14.5px;}
  .cust-selected .cp{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--canvas-dim); margin-top:2px;}
  .change-cust-btn{background:none; border:1px solid var(--line); color:var(--canvas-dim); border-radius:8px; padding:7px 11px; font-size:11.5px; font-family:'IBM Plex Mono'; cursor:pointer;}
  .cust-result{display:flex; justify-content:space-between; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-top:7px; cursor:pointer;}
  .cust-result:active{background:var(--pine);}
  .cust-result .cn{font-weight:600; font-size:13.5px;}
  .cust-result .cp{font-family:'IBM Plex Mono'; font-size:11px; color:var(--canvas-dim);}
  .new-cust-btn{width:100%; margin-top:8px; padding:11px; border-radius:9px; border:1px dashed var(--amber); background:transparent; color:var(--amber-bright); font-size:13px; font-weight:600; cursor:pointer;}
  .new-cust-form{margin-top:10px; display:flex; flex-direction:column; gap:8px;}

  /* Barang */
  .quick-gas-btn{width:100%; padding:14px; border-radius:10px; border:none; background:linear-gradient(135deg,var(--amber),#e08a3e); color:var(--pine); font-weight:700; font-size:14px; cursor:pointer; margin-bottom:12px;}
  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--pine); border:1px solid var(--line); border-radius:9px; max-height:280px; overflow-y:auto; z-index:15; display:none; box-shadow:0 8px 20px rgba(0,0,0,0.35);}
  .autocomplete-list.open{display:block;}
  .ac-row{display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer;}
  .ac-row:last-child{border-bottom:none;}
  .ac-row:active{background:var(--pine-light);}
  .ac-name{font-size:13px; flex:1; min-width:0;}
  .ac-price{font-family:'IBM Plex Mono'; font-size:11px; color:var(--amber-bright); white-space:nowrap; text-align:right;}
  .ac-stock{font-family:'IBM Plex Mono'; font-size:9.5px; color:var(--canvas-dim); display:block; margin-top:2px;}
  .ac-empty{color:var(--canvas-dim); cursor:default; text-align:center;}
  .cart-item-row{display:flex; align-items:center; gap:10px; background:var(--pine); border:1px solid var(--line); border-radius:9px; padding:10px; margin-top:8px;}
  .cart-item-row .ci-info{flex:1; min-width:0;}
  .cart-item-row .ci-name{font-weight:600; font-size:13px;}
  .cart-item-row .ci-price{font-family:'IBM Plex Mono'; font-size:11px; color:var(--canvas-dim); margin-top:2px;}
  .ci-stepper{display:flex; align-items:center; gap:8px; flex:none;}
  .ci-stepper button{width:28px; height:28px; border-radius:8px; border:1px solid var(--amber); background:transparent; color:var(--amber-bright); font-size:15px; cursor:pointer;}
  .ci-stepper .val{font-family:'IBM Plex Mono'; font-weight:600; min-width:16px; text-align:center;}
  .ci-remove{background:none; border:none; color:var(--brick); font-size:14px; cursor:pointer; flex:none; padding:4px;}
  .cart-summary{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);}
  .cart-line{display:flex; justify-content:space-between; font-size:12.5px; padding:4px 0;}

  /* Durasi */
  .row2{display:flex; gap:10px;}
  .row2 > div{flex:1;}
  label.small{display:block; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--canvas-dim); margin-bottom:5px;}

  .advanced-toggle{background:none; border:none; color:var(--amber-bright); font-family:'IBM Plex Mono'; font-size:11.5px; cursor:pointer; padding:0; text-decoration:underline; margin-top:4px;}
  .advanced-box{margin-top:10px; display:none; flex-direction:column; gap:8px;}
  .advanced-box.open{display:flex;}

  /* Pembayaran / split bill */
  .total-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}
  .total-row .tl{font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--canvas-dim);}
  .total-row .tv{font-family:'Big Shoulders Display'; font-size:26px; font-weight:800; color:var(--amber-bright);}
  .pay-line{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .pay-line select{flex:1;}
  .pay-line input{flex:1;}
  .pay-line .rm-pay{background:none; border:none; color:var(--brick); font-size:16px; cursor:pointer; flex:none; padding:4px 6px;}
  .add-pay-btn{background:none; border:1px dashed var(--line); color:var(--canvas-dim); border-radius:8px; padding:9px; width:100%; font-size:12.5px; cursor:pointer; margin-top:2px;}
  .pay-status{margin-top:12px; padding:10px 12px; border-radius:9px; font-family:'IBM Plex Mono'; font-size:12.5px; font-weight:600;}
  .pay-status.lunas{background:rgba(127,168,79,0.15); color:var(--ok);}
  .pay-status.sebagian{background:rgba(201,162,39,0.15); color:var(--warn);}
  .pay-status.lebih{background:rgba(179,59,46,0.15); color:var(--brick);}

  .submit-btn{width:100%; padding:15px; border-radius:11px; border:none; background:var(--amber); color:var(--pine); font-family:'IBM Plex Mono'; font-weight:700; font-size:14px; cursor:pointer; margin-top:6px;}
  .submit-btn:disabled{opacity:0.35;}
  .err-text{color:#E2917F; font-size:12px; font-family:'IBM Plex Mono'; margin-top:8px; min-height:16px;}

  .confirm-box{text-align:center; padding:20px 4px;}
  .confirm-box .ci{font-size:40px;}
  .confirm-box h2{font-size:20px; margin:8px 0;}
  .confirm-box .no{font-family:'IBM Plex Mono'; color:var(--amber-bright); font-size:13px; margin-bottom:14px;}
  .wa-btn{display:block; margin-top:10px; padding:13px; border-radius:10px; background:#25D366; color:#0b1a10; font-family:'IBM Plex Mono'; font-weight:700; font-size:13px; text-decoration:none; text-align:center;}
  .new-txn-btn{display:block; width:100%; margin-top:10px; padding:13px; border-radius:10px; border:1px solid var(--line); background:transparent; color:var(--canvas); font-size:13px; cursor:pointer;}

  .status-pill{display:inline-block; font-family:'IBM Plex Mono'; font-size:10.5px; padding:3px 8px; border-radius:999px; margin-top:8px;}
  .status-offline{background:rgba(201,162,39,0.18); color:var(--warn);}
  .status-online{background:rgba(127,168,79,0.18); color:var(--ok);}
  .empty{padding:16px; text-align:center; color:var(--canvas-dim); font-size:13px;}

  #loginScreen{max-width:360px; margin:40px auto; padding:0 14px;}
  #loginScreen .section{text-align:left;}
  #loginError{color:#E2917F; font-size:12.5px; margin-top:8px; min-height:16px;}
  .login-submit-btn{width:100%; padding:13px; border-radius:10px; border:none; background:var(--amber); color:var(--pine); font-family:'IBM Plex Mono'; font-weight:700; font-size:13.5px; cursor:pointer; margin-top:4px;}
  .login-submit-btn:disabled{opacity:0.5;}
  .logout-btn{position:fixed; top:14px; right:14px; z-index:25; background:none; border:1px solid var(--line); color:var(--canvas-dim); border-radius:8px; padding:6px 10px; font-family:'IBM Plex Mono'; font-size:10.5px; cursor:pointer;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="section">
    <div class="section-title" style="margin-bottom:6px;">🔒 Login Admin</div>
    <div class="hint">Masuk pakai email &amp; password yang sama dengan aplikasi utama Prof Camping.</div>

<button class="logout-btn" id="logoutBtn" hidden>Keluar</button>

<main id="formView">

    <div class="autocomplete-wrap">

      <div class="autocomplete-list" id="itemSuggestions"></div>

    <div id="cartItemList"></div>
    <div class="cart-summary" id="cartSummary"></div>
  </div>

  <div class="section">
    <div class="section-title"><span class="section-num">2</span>Pelanggan</div>
    <div id="custArea"></div>
  </div>

  <div class="section">
    <div class="section-title"><span class="section-num">3</span>Durasi Sewa</div>
    <div class="row2">
      <div><label class="small">Mulai Sewa</label><input class="field" type="date" id="startDateInput"></div>
      <div><label class="small">Lama (hari)</label><input class="field" type="number" min="1" id="durationInput" value="1"></div>
    </div>
    <div class="hint" id="dateSummary" style="margin-top:8px;"></div>
    <button type="button" class="advanced-toggle" id="advancedToggle">+ Opsi lanjutan (diskon &amp; jaminan)</button>
    <div class="advanced-box" id="advancedBox">
      <label class="small">Diskon (Rp)</label>

        <option value="lain">Kartu Lain</option>
      </select>
      <input class="field" id="jaminanNote" placeholder="Catatan jaminan (opsional)">
    </div>
  </div>

  <div class="section">
    <div class="section-title"><span class="section-num">4</span>Pembayaran</div>
    <div class="total-row"><span class="tl">TOTAL TAGIHAN</span><span class="tv mono" id="totalDisplay">Rp 0</span></div>
    <div id="payLines"></div>
    <button type="button" class="add-pay-btn" id="addPayBtn">+ Tambah Metode Bayar (split bill)</button>
    <div class="pay-status" id="payStatus"></div>
  </div>

  <div class="err-text" id="formError"></div>
  <button class="submit-btn" id="submitBtn">✓ Simpan Transaksi</button>
</main>

<main id="confirmView" style="display:none;">
  <div class="section confirm-box">
    <div class="ci">✅</div>
    <h2>Transaksi Tersimpan</h2>
    <div class="no mono" id="confirmNo"></div>
    <div class="hint" id="confirmSummary" style="margin:0;"></div>
    <a class="wa-btn" id="waSendBtn" href="#" target="_blank">💬 Kirim Struk via WhatsApp</a>
    <button class="new-txn-btn" id="newTxnBtn">+ Transaksi Baru</button>
  </div>
</main>
</div>

<script>
// ================= FIREBASE (project sama dengan aplikasi admin Prof Camping) =================

const fmt = n => "Rp " + (n||0).toLocaleString("id-ID");
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayISO = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const addDays = (iso,n) => { const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), da=String(d.getDate()).padStart(2,"0"); return `${y}-${m}-${da}`; };
const fmtDate = iso => { const d=new Date(iso+"T00:00:00"); return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"}); };
const methodLabel = m => m==="qris" ? "QRIS" : m==="transfer" ? "Transfer" : "Cash";

// Terima format nomor apa saja (082xxx, 628xxx, +62-821-xxx, dsb) -> disamakan jadi "62xxxxxxxxxx"
function normalizePhone(raw){
  let d = (raw||"").replace(/[^0-9]/g,"");
  if(d.startsWith("620")) d = "62"+d.slice(3);
  else if(d.startsWith("0")) d = "62"+d.slice(1);
  else if(!d.startsWith("62")) d = "62"+d;
  return d;
}

// ================= KATALOG (sama persis dengan aplikasi admin) =================
const CATALOG = [
["Tenda 7 Orang Tendaki Molucass 6 Pro","Tenda",100000],

let productOverrides = {};
let customProducts = [];
let productStock = {};
let transactions = [];
let customersCache = [];

function allProducts(){
  const base = CATALOG.map(p=>{
    const o = productOverrides[p.id];
    return o ? Object.assign({}, p, o) : p;
  });
  return [...base, ...customProducts];
}
function getCategories(){
  const cats = [...new Set(allProducts().map(p=>p.cat))];
  return cats.sort((a,b)=> a==="Tenda" ? -1 : b==="Tenda" ? 1 : a.localeCompare(b,"id",{sensitivity:"base"}));
}
function itemRemainingQty(i){ return Math.max(0, (i.qty||0) - Math.min(i.returnedQty||0, i.qty||0)); }
function stockKeluar(name){
  return transactions.reduce((sum,t)=>{
    if(t.status!=="aktif") return sum;
    return sum + (t.items||[]).filter(i=>i.name===name).reduce((s,i)=>s+itemRemainingQty(i),0);
  },0);
}
function stockBersih(product){
  const s = productStock[product.id];
  if(!s || !s.total) return null; // stok belum diatur
  return Math.max(0, s.bersih||0);
}

// ================= STATE =================
let selectedCustomer = null;

let cart = {}; // productId -> qty

let durationDays = 1;
let discountAmount = 0;
let jaminan = { type:"none", note:"" };

// Menggambar ulang daftar (innerHTML) bikin elemen yang baru disentuh "hilang lalu muncul lagi" sebagai
// elemen baru — di iPhone/Safari ini suka memicu scroll otomatis balik ke atas halaman.
// Fungsi ini menyimpan posisi scroll dulu, jalankan fn (render ulang), lalu kembalikan posisinya persis semula.
function preserveScroll(fn){
  const y = window.scrollY;
  fn();
  window.scrollTo(0, y);
}

// ---------- PELANGGAN ----------
const custArea = document.getElementById("custArea");
function renderCustArea(){
  if(selectedCustomer){
    custArea.innerHTML = `
      <div class="cust-selected">
        <div><div class="cn">${selectedCustomer.name}</div><div class="cp">${selectedCustomer.phone}</div></div>
        <button class="change-cust-btn" id="changeCustBtn">Ganti</button>
      </div>`;
    document.getElementById("changeCustBtn").addEventListener("click", ()=>{ selectedCustomer = null; showNewCustForm=false; renderCustArea(); });
    return;
  }
  custArea.innerHTML = `
    <input class="field" id="custSearchInput" placeholder="Cari nama atau nomor HP...">
    <div id="custResults"></div>
    <button type="button" class="new-cust-btn" id="showNewCustBtn">+ Pelanggan Baru</button>
    <div class="new-cust-form" id="newCustForm" style="display:${showNewCustForm?'flex':'none'};">
      <input class="field" id="newCustName" placeholder="Nama lengkap">
      <input class="field" id="newCustPhone" placeholder="No. HP (boleh 082xxx / 628xxx / +62 821xxx)" inputmode="tel">
      <button type="button" class="new-cust-btn" id="confirmNewCustBtn" style="border-style:solid;">✓ Pakai Pelanggan Ini</button>
    </div>`;
  const searchInput = document.getElementById("custSearchInput");
  const resultsEl = document.getElementById("custResults");
  function renderResults(){
    const q = searchInput.value.trim().toLowerCase();
    if(!q){ resultsEl.innerHTML = ""; return; }
    const qDigits = normalizePhone(q);
    const matches = customersCache.filter(c=>
      (c.name||"").toLowerCase().includes(q) || (qDigits.length>=3 && normalizePhone(c.phone||"").includes(qDigits))
    ).slice(0,8);
    resultsEl.innerHTML = matches.map(c=>`
      <div class="cust-result" data-id="${c.id}"><div><div class="cn">${c.name}</div><div class="cp">${c.phone}</div></div><span>›</span></div>
    `).join("") || `<div class="hint" style="margin:8px 0 0;">Tidak ketemu, coba "+ Pelanggan Baru" di bawah.</div>`;
    resultsEl.querySelectorAll(".cust-result").forEach(el=>{
      el.addEventListener("click", ()=>{
        selectedCustomer = customersCache.find(c=>c.id===el.dataset.id);
        showNewCustForm = false;
        renderCustArea();
      });
    });
  }
  searchInput.addEventListener("input", renderResults);
  document.getElementById("showNewCustBtn").addEventListener("click", ()=>{ showNewCustForm = true; renderCustArea(); });
  if(showNewCustForm){
    document.getElementById("confirmNewCustBtn").addEventListener("click", ()=>{
      const name = document.getElementById("newCustName").value.trim();
      const phoneRaw = document.getElementById("newCustPhone").value.trim();
      if(!name || !phoneRaw) return;
      const phone = normalizePhone(phoneRaw);
      const existing = customersCache.find(c=>normalizePhone(c.phone||"")===phone);
      selectedCustomer = existing ? { ...existing, name } : { id: uid(), name, phone, __isNew:true };
      showNewCustForm = false;
      renderCustArea();
    });
  }
}

// ---------- BARANG: ketik nama, pilih dari saran (autocomplete) ----------
function cartEntries(){
  return Object.keys(cart).map(id=>({ product: allProducts().find(p=>p.id===id), qty: cart[id] })).filter(e=>e.product);
}
function cartSubtotalPerDay(){ return cartEntries().reduce((s,e)=>s+e.product.price*e.qty,0); }
function grandTotal(){ return Math.max(0, cartSubtotalPerDay()*durationDays - discountAmount); }

function addToCart(productId, qty){
  qty = Math.max(0, qty);
  if(qty<=0) delete cart[productId]; else cart[productId] = qty;
  renderCartItemList(); renderCartSummary(); updatePayDefaults();
}

function renderCartItemList(){
  const el = document.getElementById("cartItemList");
  const entries = cartEntries();
  if(entries.length===0){ el.innerHTML = `<div class="empty" style="padding:14px 4px;">Belum ada barang dipilih. Ketik nama barang di atas.</div>`; return; }
  el.innerHTML = entries.map(e=>{
    const bersih = stockBersih(e.product);
    const stockHint = bersih!==null ? ` · Bersih: ${bersih}` : "";
    return `<div class="cart-item-row" data-pid="${e.product.id}">
      <div class="ci-info">
        <div class="ci-name">${e.product.name}</div>
        <div class="ci-price">${fmt(e.product.price)}/hari${stockHint}</div>
      </div>
      <div class="ci-stepper">
        <button type="button" data-op="-" data-pid="${e.product.id}">−</button>
        <span class="val">${e.qty}</span>
        <button type="button" data-op="+" data-pid="${e.product.id}">+</button>
      </div>
      <button class="ci-remove" data-op="rm" data-pid="${e.product.id}">✕</button>
    </div>`;
  }).join("");

  el.querySelectorAll("[data-op]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const pid = btn.dataset.pid;
      const op = btn.dataset.op;
      const qty = cart[pid] || 0;
      preserveScroll(()=>{
        if(op==="rm") addToCart(pid, 0);
        else addToCart(pid, op==="+" ? qty+1 : qty-1);
      });
    });
  });
}
function renderCartSummary(){
  const entries = cartEntries();
  const el = document.getElementById("cartSummary");
  if(entries.length===0){ el.innerHTML = ""; return; }
  el.innerHTML = entries.map(e=>`<div class="cart-line"><span>${e.product.name} ×${e.qty}</span><span class="mono">${fmt(e.product.price*e.qty*durationDays)}</span></div>`).join("");
}

const itemSearchInput = document.getElementById("itemSearchInput");
const itemSuggestions = document.getElementById("itemSuggestions");
itemSearchInput.addEventListener("input", ()=>{
  const q = itemSearchInput.value.trim().toLowerCase();
  if(!q){ itemSuggestions.innerHTML = ""; itemSuggestions.classList.remove("open"); return; }
  const results = allProducts()
    .filter(p=>p.name.toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,"id",{sensitivity:"base"}))
    .slice(0,8);
  itemSuggestions.innerHTML = results.length ? results.map(p=>{
    const bersih = stockBersih(p);
    return `<div class="ac-row" data-id="${p.id}">
      <span class="ac-name">${p.name}${bersih!==null ? `<span class="ac-stock">Bersih: ${bersih}</span>`:""}</span>
      <span class="ac-price">${fmt(p.price)}</span>
    </div>`;
  }).join("") : `<div class="ac-row ac-empty">Barang tidak ditemukan</div>`;
  itemSuggestions.classList.add("open");
  itemSuggestions.querySelectorAll("[data-id]").forEach(row=>{
    row.addEventListener("click", ()=>{
      const id = row.dataset.id;
      addToCart(id, (cart[id]||0) + 1);
      itemSearchInput.value = ""; itemSuggestions.innerHTML = ""; itemSuggestions.classList.remove("open");
      itemSearchInput.focus();
    });
  });
});
itemSearchInput.addEventListener("blur", ()=>{ setTimeout(()=>itemSuggestions.classList.remove("open"), 150); });

// Cari produk gas dengan aman: berdasarkan ID bawaan (p27) ATAU nama yang mengandung "isi gas",
// supaya tetap ketemu walau admin sempat ganti nama produknya lewat aplikasi utama.
function findGasProduct(){
  return allProducts().find(p=>p.id==="p27") || allProducts().find(p=>p.name.toLowerCase().includes("isi gas"));
}
document.getElementById("quickGasBtn").addEventListener("click", ()=>{
  const gasProduct = findGasProduct();
  if(!gasProduct){
    document.getElementById("formError").textContent = "Produk 'Sewa Tabung + Isi Gas' tidak ditemukan di katalog.";
    return;
  }
  addToCart(gasProduct.id, (cart[gasProduct.id]||0) + 1);
});


// ---------- DURASI ----------
document.getElementById("startDateInput").value = startDate;
function updateDateSummary(){
  document.getElementById("dateSummary").textContent = `${fmtDate(startDate)} → ${fmtDate(addDays(startDate,durationDays))} (${durationDays} hari)`;
}
document.getElementById("startDateInput").addEventListener("change", e=>{ startDate = e.target.value || todayISO(); updateDateSummary(); renderCartSummary(); updatePayDefaults(); });
document.getElementById("durationInput").addEventListener("input", e=>{ durationDays = Math.max(1, parseInt(e.target.value)||1); updateDateSummary(); renderCartSummary(); updatePayDefaults(); });
updateDateSummary();

document.getElementById("advancedToggle").addEventListener("click", ()=>{
  document.getElementById("advancedBox").classList.toggle("open");
});
document.getElementById("discountInput").addEventListener("input", e=>{ discountAmount = Math.max(0, parseInt(e.target.value)||0); updatePayDefaults(); });
document.getElementById("jaminanType").addEventListener("change", e=>{ jaminan.type = e.target.value; });
document.getElementById("jaminanNote").addEventListener("input", e=>{ jaminan.note = e.target.value; });

// ---------- PEMBAYARAN (SPLIT BILL) ----------
function updatePayDefaults(){
  document.getElementById("totalDisplay").textContent = fmt(grandTotal());
  // kalau cuma 1 baris bayar, otomatis samakan dengan total (memudahkan kasus umum: lunas 1 metode)
  if(payLines.length===1) payLines[0].amount = grandTotal();
  renderPayLines();
}
function renderPayLines(){
  const el = document.getElementById("payLines");
  el.innerHTML = payLines.map((line,idx)=>`
    <div class="pay-line" data-idx="${idx}">
      <select class="field" data-role="method">
        <option value="cash" ${line.method==='cash'?'selected':''}>Cash</option>
        <option value="qris" ${line.method==='qris'?'selected':''}>QRIS</option>
        <option value="transfer" ${line.method==='transfer'?'selected':''}>Transfer</option>
      </select>
      <input class="field" type="number" min="0" data-role="amount" value="${line.amount}" placeholder="Jumlah">
      ${payLines.length>1 ? `<button type="button" class="rm-pay" data-role="rm">✕</button>` : ""}
    </div>
  `).join("");
  el.querySelectorAll(".pay-line").forEach(row=>{
    const idx = parseInt(row.dataset.idx);
    row.querySelector('[data-role="method"]').addEventListener("change", e=>{ payLines[idx].method = e.target.value; });
    row.querySelector('[data-role="amount"]').addEventListener("input", e=>{ payLines[idx].amount = Math.max(0, parseInt(e.target.value)||0); renderPayStatus(); });
    const rm = row.querySelector('[data-role="rm"]');
    if(rm) rm.addEventListener("click", ()=>{ payLines.splice(idx,1); renderPayLines(); renderPayStatus(); });
  });
  renderPayStatus();
}
function totalPaid(){ return payLines.reduce((s,l)=>s+(l.amount||0),0); }
function renderPayStatus(){
  const paid = totalPaid(), total = grandTotal();
  const statusEl = document.getElementById("payStatus");
  if(paid>total){
    statusEl.className = "pay-status lebih";
    statusEl.textContent = `⚠️ Jumlah bayar (${fmt(paid)}) melebihi total (${fmt(total)}). Kurangi salah satu baris.`;
  } else if(paid===total && total>0){
    statusEl.className = "pay-status lunas";
    statusEl.textContent = `✅ LUNAS — ${fmt(paid)}`;
  } else if(paid>0){
    statusEl.className = "pay-status sebagian";
    statusEl.textContent = `Dibayar sebagian: ${fmt(paid)} · Sisa (hutang): ${fmt(total-paid)}`;
  } else {
    statusEl.className = "pay-status sebagian";
    statusEl.textContent = `Belum dibayar (hutang penuh): ${fmt(total)}`;
  }
}
document.getElementById("addPayBtn").addEventListener("click", ()=>{
  payLines.push({ method:"cash", amount:0 });
  renderPayLines();
});

// ---------- SUBMIT ----------
function nextTxnNo(){
  let maxNum = 0;
  transactions.forEach(t=>{
    const m = /^TRX-(\d+)$/.exec(t.no||"");
    if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
  });
  return "TRX-" + String(maxNum+1).padStart(4,"0");
}
function buildReceiptMessage(t){
  const div = "━━━━━━━━━━━━━━━";
  const paid = (t.paymentHistory||[]).reduce((s,h)=>s+h.amount,0);
  const sisa = t.total - paid;
  const payLabel = sisa<=0 ? "LUNAS" : paid>0 ? "DIBAYAR SEBAGIAN" : "BELUM BAYAR";
  let msg = `🏕️ *PROF CAMPING — STRUK SEWA*\n${div}\n`;
  msg += `👤 *${t.customer.name}*\n📱 ${t.customer.phone}\n${div}\n`;
  msg += `📦 *Barang Disewa:*\n`;
  t.items.forEach(i=>{ msg += `• ${i.name} ×${i.qty} — ${fmt(i.price*i.qty*t.durationDays)}\n`; });
  msg += `${div}\n📅 Mulai   : ${fmtDate(t.startDate)}\n📅 Selesai : ${fmtDate(t.endDate)}\n⏱️ Lama Sewa: ${t.durationDays} hari\n${div}\n`;
  if(t.discount && t.discount.amount>0){ msg += `Subtotal : ${fmt(t.subtotal)}\nDiskon   : −${fmt(t.discount.amount)}\n`; }
  msg += `💰 *TOTAL: ${fmt(t.total)}*\nStatus Bayar: *${payLabel}*\n`;
  if(t.paymentHistory.length>1){
    msg += `Rincian Bayar:\n`;
    t.paymentHistory.forEach(h=>{ msg += `  - ${methodLabel(h.method)}: ${fmt(h.amount)}\n`; });
  } else if(t.paymentHistory.length===1){
    msg += `Metode Bayar: *${methodLabel(t.paymentHistory[0].method)}*\n`;
  }
  if(sisa>0) msg += `Sisa Tagihan: *${fmt(sisa)}*\n`;
  msg += `${div}\n🙏 Terima kasih telah menyewa di Prof Camping!`;
  return msg;
}

document.getElementById("submitBtn").addEventListener("click", async ()=>{
  const errEl = document.getElementById("formError");
  errEl.textContent = "";
  const entries = cartEntries();
  const total = grandTotal();
  const paid = totalPaid();

  if(!selectedCustomer){ errEl.textContent = "Pilih atau tambah pelanggan dulu."; return; }
  if(entries.length===0){ errEl.textContent = "Pilih barang dulu."; return; }
  if(paid>total){ errEl.textContent = "Jumlah bayar melebihi total tagihan, perbaiki dulu."; return; }
  if(!firebaseEnabled){ errEl.textContent = "Tidak bisa konek ke server, cek internet."; return; }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "Menyimpan…";

  try{
    let customer = selectedCustomer;
    if(customer.__isNew || !customersCache.some(c=>c.id===customer.id)){
      const { __isNew, ...cleanCustomer } = customer;
      customer = cleanCustomer;
      const newCustomers = [...customersCache, customer];
      await db.collection("prof_camping_data").doc("basecamp_customers").set({ value: newCustomers, updatedAt: Date.now() });
      customersCache = newCustomers;
    }

    const subtotal = cartSubtotalPerDay()*durationDays;
    const nonZeroPayLines = payLines.filter(l=>l.amount>0);
    const paymentHistory = nonZeroPayLines.map(l=>({ id: uid(), amount: l.amount, method: l.method, note: nonZeroPayLines.length>1 ? "Split bill" : "", at: new Date().toISOString() }));
    const dominantMethod = nonZeroPayLines.length
      ? nonZeroPayLines.reduce((a,b)=> b.amount>a.amount ? b : a).method
      : "cash";
    const status = paid<=0 ? "hutang" : (paid>=total ? "lunas" : "sebagian");

    const txn = {
      id: uid(),
      customer,
      items: entries.map(e=>({ name:e.product.name, price:e.product.price, qty:e.qty })),
      durationDays, startDate, endDate: addDays(startDate, durationDays),
      subtotal,
      discount: { type: discountAmount>0?"nominal":"none", value: discountAmount, amount: discountAmount },
      jaminan: { type: jaminan.type, note: jaminan.note||"" },
      payment: { status, paidAmount: paid, method: dominantMethod },
      paymentHistory,
      total,
      status: "aktif",
      dendaList: [],
      jaminanReturned: false,
      fromBookingId: null,
      source: "kasir-cepat",
      createdAt: new Date().toISOString()
    };
    // Simpan pakai Firestore Transaction (bukan tulis-ulang dari data lokal) — ini SELALU baca data
    // TERBARU dari server dulu sebelum nambahkan transaksi baru (termasuk nomor urutnya), jadi walau
    // tab ini sempat lama tidak aktif/background (data lokalnya ketinggalan), transaksi lain yang masuk
    // di antaranya TIDAK akan tertimpa maupun bentrok nomor.
    const txnRef = db.collection("prof_camping_data").doc("basecamp_transactions");
    await db.runTransaction(async (tx)=>{
      const snap = await tx.get(txnRef);
      const currentServer = snap.exists ? (snap.data().value||[]) : [];
      let maxNum = 0;
      currentServer.forEach(t=>{
        const m = /^TRX-(\d+)$/.exec(t.no||"");
        if(m) maxNum = Math.max(maxNum, parseInt(m[1],10));
      });
      txn.no = "TRX-" + String(maxNum+1).padStart(4,"0");
      tx.set(txnRef, { value: [txn, ...currentServer], updatedAt: Date.now() });
    });
    // transactions lokal akan ikut ter-update otomatis lewat listener onSnapshot sesaat lagi

    lastCreatedTxn = txn;
    document.getElementById("confirmNo").textContent = txn.no;
    document.getElementById("confirmSummary").textContent = `${customer.name} · ${fmt(total)} · ${status==='lunas'?'LUNAS':status==='sebagian'?'Dibayar sebagian':'Belum bayar'}`;
    document.getElementById("waSendBtn").href = `https://wa.me/${customer.phone}?text=${encodeURIComponent(buildReceiptMessage(txn))}`;
    document.getElementById("formView").style.display = "none";
    document.getElementById("confirmView").style.display = "";
  }catch(err){
    console.error("Gagal simpan transaksi:", err);
    errEl.textContent = "Gagal menyimpan, coba lagi. Pastikan internet aktif.";
  }finally{
    btn.disabled = false; btn.textContent = "✓ Simpan Transaksi";
  }
});

document.getElementById("newTxnBtn").addEventListener("click", ()=>{
  selectedCustomer = null; showNewCustForm = false;
  cart = {}; discountAmount = 0; jaminan = { type:"none", note:"" };
  payLines = [{ method:"cash", amount:0 }];
  document.getElementById("discountInput").value = "";
  document.getElementById("jaminanType").value = "none";
  document.getElementById("jaminanNote").value = "";
  document.getElementById("advancedBox").classList.remove("open");
  renderCustArea(); renderCartItemList(); renderCartSummary(); updatePayDefaults();
  document.getElementById("confirmView").style.display = "none";
  document.getElementById("formView").style.display = "";
  window.scrollTo(0,0);
});

// ================= LOGIN ADMIN (WAJIB, supaya Firestore mengizinkan simpan transaksi) =================
const loginScreen = document.getElementById("loginScreen");
const appScreen = document.getElementById("appScreen");
const logoutBtn = document.getElementById("logoutBtn");
const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");
let auth = null, syncStarted = false;

if(firebaseEnabled){
  try{ auth = firebase.auth(); }catch(err){ console.error("Gagal menyiapkan login.", err); }
}

if(firebaseEnabled && auth){
  auth.onAuthStateChanged(user=>{
    if(user){
      loginScreen.hidden = true; appScreen.hidden = false; logoutBtn.hidden = false;
      if(!syncStarted){ syncStarted = true; startSync(); }
    } else {
      loginScreen.hidden = false; appScreen.hidden = true; logoutBtn.hidden = true;
    }
  });
  function doLogin(){
    const email = loginEmail.value.trim();
    const password = loginPassword.value;
    if(!email || !password){ loginError.textContent = "Isi email dan password dulu."; return; }
    loginBtn.disabled = true; loginBtn.textContent = "Memproses…"; loginError.textContent = "";
    auth.signInWithEmailAndPassword(email, password)
      .catch(()=>{ loginError.textContent = "Email atau password salah."; })
      .finally(()=>{ loginBtn.disabled = false; loginBtn.textContent = "Masuk"; });
  }
  loginBtn.addEventListener("click", doLogin);
  loginPassword.addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
  logoutBtn.addEventListener("click", ()=>{ auth.signOut(); });
} else {
  // Firebase/login belum siap: tetap tampilkan pesan di layar login, tidak bisa lanjut
  document.getElementById("loginScreen").querySelector(".hint").textContent = "Tidak bisa konek ke server login. Cek koneksi internet lalu buka ulang halaman ini.";
}

// ================= SINKRONISASI REALTIME (baru jalan setelah login berhasil) =================
function startSync(){
  const statusPill = document.getElementById("statusPill");
  let ready = { overrides:false, custom:false, stock:false, txn:false, cust:false };
  function checkReady(){
    if(Object.values(ready).every(Boolean)){
      statusPill.textContent = "Tersambung Online"; statusPill.className = "status-pill status-online";
      renderCustArea(); renderCartItemList(); updatePayDefaults();
    }
  }
  db.collection("prof_camping_data").doc("basecamp_product_overrides").onSnapshot(snap=>{
    productOverrides = snap.exists ? (snap.data().value||{}) : {};
    ready.overrides = true; checkReady(); renderCartItemList();
  });
  db.collection("prof_camping_data").doc("basecamp_custom_products").onSnapshot(snap=>{
    customProducts = snap.exists ? (snap.data().value||[]) : [];
    ready.custom = true; checkReady(); renderCartItemList();
  });
  db.collection("prof_camping_data").doc("basecamp_product_stock").onSnapshot(snap=>{
    productStock = snap.exists ? (snap.data().value||{}) : {};
    ready.stock = true; checkReady(); renderCartItemList();
  }, ()=>{ statusPill.textContent = "Gagal Tersambung"; statusPill.className = "status-pill status-offline"; });
  db.collection("prof_camping_data").doc("basecamp_transactions").onSnapshot(snap=>{
    transactions = snap.exists ? (snap.data().value||[]) : [];
    ready.txn = true; checkReady();
  });
  db.collection("prof_camping_data").doc("basecamp_customers").onSnapshot(snap=>{
    customersCache = snap.exists ? (snap.data().value||[]) : [];
    ready.cust = true; checkReady();
  });
}
</script>
